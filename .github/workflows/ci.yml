name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Deploys require a successful CI run on the exact commit being deployed
  # (see .github/workflows/deploy.yml). Dispatch exists so a commit that predates that
  # rule, or whose run was canceled, can be made deployable without an empty commit.
  workflow_dispatch:
  schedule:
    # Quarterly-ish freshness check on the upstream feeds. Source data updates annually,
    # but a broken endpoint should surface long before the next refresh is due.
    - cron: "17 9 1 */3 *"

permissions:
  contents: read

concurrency:
  # Key pull requests on the ref and pushes on the commit.
  #
  # A concurrency group holds one running run and one pending run. When a third
  # run joins the group, GitHub cancels the pending one before it has dispatched
  # a single job, so that commit ends `cancelled` with zero jobs and no verdict.
  # With `cancel-in-progress: true` the running run is cancelled instead, part-way
  # through — also no verdict. Either way a group keyed only on `github.ref` makes
  # every push to `main` contend with the merge before it.
  #
  # Measured 2026-09-05 over the 100 most recent runs on `main`: 17 ended
  # `cancelled` (2 of them with zero jobs dispatched), and 20 of the last 100
  # commits on `main` have no successful CI run at all. `verify` is this
  # repository's only required status check, and `deploy.yml` refuses to deploy a
  # commit without a successful CI run on that exact SHA — so each of those
  # commits is both unverified and undeployable without a manual dispatch.
  #
  # Adding the SHA for pushes gives every merge its own group, so pushes never
  # contend. Pull requests keep the shared `-pr` key, so pushing again to a PR
  # still cancels the previous, now-irrelevant run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Verify
        # make verify = provenance-check, ruff lint, mypy typecheck, pytest with
        # coverage, bandit security scan, pip-audit dependency audit.
        run: make verify

  web:
    # Typecheck, unit tests, static export, and an axe pass over the built pages.
    # Builds against the committed fixture rather than the live sources: DOL returns 403 to
    # GitHub Actions runners, and CI should not fail because a third party is unreachable.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          make install
          make web-install

      - name: Install Playwright's browser
        # `npm ci` installs the playwright package, not the browser binary it drives.
        # `a11y:rendered` (and `a11y:browser`) need Chromium actually present, which is
        # this runner's job to fetch -- it is not restored by the npm cache above.
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Build dataset from fixture
        run: make data-offline

      - name: Verify site
        run: make web-verify

      - name: Confirm this build is not publishable
        # Says out loud what the two steps above imply. CI has no production dataset (DOL
        # refuses runner egress) and sets no NEXT_PUBLIC_SITE_URL, so what it exports is a
        # 60-program fixture that advertises example.invalid. That is correct for a test
        # build and catastrophic as a published one, which is why the deploy workflow
        # refuses both markers rather than trusting anyone to remember the difference.
        # If this step ever fails, CI has started producing something that looks
        # deployable, and the guards in deploy.yml need re-reading before it is.
        #
        # A `make` target rather than inline shell: this was the one assertion in the
        # pipeline a developer could not reproduce, so a tree green locally could still be
        # rejected here. `tests/test_ci_artifact_check.py` covers both directions.
        run: make ci-artifact-check

  data-freshness:
    # Confirms the public sources still respond and still contain California data.
    # Never blocks a pull request; upstream outages are not this repo's fault, and DOL is
    # known to refuse GitHub Actions runners outright, so this is informational only.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Rebuild dataset from upstream
        run: make data
