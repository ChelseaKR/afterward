name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Deploys require a successful CI run on the exact commit being deployed
  # (see .github/workflows/deploy.yml). Dispatch exists so a commit that predates that
  # rule, or whose run was canceled, can be made deployable without an empty commit.
  workflow_dispatch:
  schedule:
    # Quarterly-ish freshness check on the upstream feeds. Source data updates annually,
    # but a broken endpoint should surface long before the next refresh is due.
    - cron: "17 9 1 */3 *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Verify
        # make verify = provenance-check, ruff lint, mypy typecheck, pytest with
        # coverage, bandit security scan, pip-audit dependency audit.
        run: make verify

  web:
    # Typecheck, unit tests, static export, and an axe pass over the built pages.
    # Builds against the committed fixture rather than the live sources: DOL returns 403 to
    # GitHub Actions runners, and CI should not fail because a third party is unreachable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          make install
          make web-install

      - name: Install Playwright's browser
        # `npm ci` installs the playwright package, not the browser binary it drives.
        # `a11y:rendered` (and `a11y:browser`) need Chromium actually present, which is
        # this runner's job to fetch -- it is not restored by the npm cache above.
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Build dataset from fixture
        run: make data-offline

      - name: Verify site
        run: make web-verify

      - name: Confirm this build is not publishable
        # Says out loud what the two lines above imply. CI has no production dataset (DOL
        # refuses runner egress) and sets no NEXT_PUBLIC_SITE_URL, so what it exports is a
        # 60-program fixture that advertises example.invalid. That is correct for a test
        # build and catastrophic as a published one, which is why the deploy workflow
        # refuses both markers rather than trusting anyone to remember the difference.
        # If this step ever fails, CI has started producing something that looks
        # deployable, and the guards in deploy.yml need re-reading before it is.
        run: |
          set -euo pipefail
          python3 -c 'import json,sys; d=json.load(open("web/public/data/coverage.json")); sys.exit(0 if d.get("is_fixture") else "::error::CI built a dataset that is not the fixture.")'
          grep -qF 'example.invalid' web/out/robots.txt || {
            echo "::error::A CI build carrying a real site URL is a publishable artifact."; exit 1; }
          echo "CI artifact is fixture-backed and placeholder-hosted, as it must be."

  data-freshness:
    # Confirms the public sources still respond and still contain California data.
    # Never blocks a pull request; upstream outages are not this repo's fault, and DOL is
    # known to refuse GitHub Actions runners outright, so this is informational only.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Rebuild dataset from upstream
        run: make data
