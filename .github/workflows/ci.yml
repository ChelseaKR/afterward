name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Deploys require a successful CI run on the exact commit being deployed
  # (see .github/workflows/deploy.yml). Dispatch exists so a commit that predates that
  # rule, or whose run was canceled, can be made deployable without an empty commit.
  workflow_dispatch:
  schedule:
    # Quarterly-ish freshness check on the upstream feeds. Source data updates annually,
    # but a broken endpoint should surface long before the next refresh is due.
    - cron: "17 9 1 */3 *"
    # Weekly, and on a cadence of its own because it asks a different question: not "are the
    # sources still there" but "is the site still serving something this code would publish".
    # That answer can change without anybody touching the sources, and it does -- it changes
    # the moment a repair lands here, because the artifact in production was built before it.
    - cron: "23 14 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Verify
        # make verify = provenance-check, ruff lint, mypy typecheck, pytest with
        # coverage, bandit security scan, pip-audit dependency audit.
        run: make verify

  web:
    # Typecheck, unit tests, static export, and an axe pass over the built pages.
    # Builds against the committed fixture rather than the live sources: DOL returns 403 to
    # GitHub Actions runners, and CI should not fail because a third party is unreachable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          make install
          make web-install

      - name: Install Playwright's browser
        # `npm ci` installs the playwright package, not the browser binary it drives.
        # `a11y:rendered` (and `a11y:browser`) need Chromium actually present, which is
        # this runner's job to fetch -- it is not restored by the npm cache above.
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Build dataset from fixture
        run: make data-offline

      - name: Verify site
        run: make web-verify

      - name: Confirm this build is not publishable
        # Says out loud what the two lines above imply. CI has no production dataset (DOL
        # refuses runner egress) and sets no NEXT_PUBLIC_SITE_URL, so what it exports is a
        # 60-program fixture that advertises example.invalid. That is correct for a test
        # build and catastrophic as a published one, which is why the deploy workflow
        # refuses both markers rather than trusting anyone to remember the difference.
        # If this step ever fails, CI has started producing something that looks
        # deployable, and the guards in deploy.yml need re-reading before it is.
        run: |
          set -euo pipefail
          python3 -c 'import json,sys; d=json.load(open("web/public/data/coverage.json")); sys.exit(0 if d.get("is_fixture") else "::error::CI built a dataset that is not the fixture.")'
          grep -qF 'example.invalid' web/out/robots.txt || {
            echo "::error::A CI build carrying a real site URL is a publishable artifact."; exit 1; }
          echo "CI artifact is fixture-backed and placeholder-hosted, as it must be."

  live-dataset:
    # Does production still serve a dataset this repository would publish?
    #
    # Every other dataset gate runs on the way out and only when somebody deploys. That
    # leaves the interval between a repair landing here and a person choosing to publish
    # completely unwatched, and it is the interval the last two data faults lived in: the
    # provider-link review landed 2026-08-15, refused three hijacked domains, and the site
    # was still serving all three two days later because no deploy had run.
    #
    # Not `continue-on-error`, unlike data-freshness below. That job is informational
    # because DOL being unreachable is not this repository's fault. This one asks about this
    # project's own site, and its answer is always actionable: rebuild with `make data`,
    # publish with `make dataset-publish`, deploy. A red run here means a reader is being
    # shown something this code refuses, which is exactly what it should look like.
    # Its own cron, and matched on the expression rather than on `event_name`, so the two
    # scheduled jobs in this file keep their own cadences. Deliberately NOT run on
    # workflow_dispatch: that dispatch exists so a commit can be made deployable
    # (see deploy.yml's "Require CI success on this exact commit"), and a job that goes red
    # because production is stale would then refuse the deploy that fixes it.
    if: github.event.schedule == '23 14 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Ask the live site what it is serving
        run: make live-check

  data-freshness:
    # Confirms the public sources still respond and still contain California data.
    # Never blocks a pull request; upstream outages are not this repo's fault, and DOL is
    # known to refuse GitHub Actions runners outright, so this is informational only.
    #
    # Matched on the cron expression rather than on `event_name`, because this file now has
    # two schedules: a plain `event_name == 'schedule'` would run this quarterly job every
    # week alongside the live-dataset one.
    if: github.event.schedule == '17 9 1 */3 *'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Rebuild dataset from upstream
        run: make data
