name: Secret scan

# Gitleaks over the full git history on every push and pull request, plus a
# weekly scheduled pass so a rule-set update can catch something an older rule
# set missed. The repo is public: a leaked credential here is public the moment
# it lands, so this runs automatically, never on dispatch alone.
#
# Verified clean against the full history (125 commits, gitleaks 8.30.1) before
# this workflow was added, so a failure here means a NEW leak, not old noise.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 10 * * 1"

permissions:
  contents: read

# CI-CD-STANDARD.md 11c: cancel superseded runs on the same ref -- but only where
# "superseded" is true. A concurrency group holds one running run and one pending run.
# Keyed on `github.ref` alone, every push to `main` joins the SAME group as the push before
# it, so a merge cancels its predecessor's scan part-way through, or evicts it from the
# queue before a single job dispatches. Either way that commit's history is never scanned,
# and nothing reports a failure -- the run reads `cancelled`, which is not a signal. For a
# secret scan on a public repository that is the worst way to lose a verdict: a leak that
# lands in a cancelled run's commit is public and unexamined.
#
# `ci.yml` was corrected the same way in #102; this brings the scan into line with it. A
# second push to a pull request genuinely does supersede the first, so pull requests keep
# the shared key and keep cancelling. Pushes to `main` get the commit SHA instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: gitleaks scans commits, not just the checkout.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
