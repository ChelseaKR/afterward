name: Secret scan

# Gitleaks over the full git history on every push and pull request, plus a
# weekly scheduled pass so a rule-set update can catch something an older rule
# set missed. The repo is public: a leaked credential here is public the moment
# it lands, so this runs automatically, never on dispatch alone.
#
# Verified clean against the full history (125 commits, gitleaks 8.30.1) before
# this workflow was added, so a failure here means a NEW leak, not old noise.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 10 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: gitleaks scans commits, not just the checkout.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
